<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092F24"><meta name="apple-mobile-web-app-capable" content="yes">
  <title>RallyUp — Pickleball Open Play</title><link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/inspiration.css">
  <link rel="stylesheet" href="css/modal-fix.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/feature-fix.css">
  <link rel="stylesheet" href="css/footer-cleanup.css">
  <link rel="stylesheet" href="css/mobile-logo-fix.css">
  <link rel="stylesheet" href="css/mobile-text-fix.css">
  <link rel="stylesheet" href="css/landing-reference.css">
  <link rel="stylesheet" href="css/landing-desktop-fix.css">
  <style>body{margin:0;background:#fff;color:#0e2a21;font-family:'Nunito Sans',sans-serif}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:10}.loader-inner{text-align:center}.loader-ball{font-size:72px;animation:bounce .8s infinite alternate}.loader-word{font:700 40px Fredoka;color:#092f24}.loader-word span{color:#2da52f}.loader-bar{width:220px;height:8px;background:#e0f4da;border-radius:9px;margin:16px auto 8px;overflow:hidden}.loader-fill{height:100%;width:12%;background:#2da52f;transition:width .3s}.loader small{color:#3f5a50}@keyframes bounce{to{transform:translateY(-16px) rotate(12deg)}}.loader.done{opacity:0;pointer-events:none;transition:opacity .3s}</style>
</head><body>
  <div id="loader" class="loader"><div class="loader-inner"><div class="loader-ball" aria-label="Bouncing pickleball"><svg viewBox="0 0 120 120" role="img"><circle cx="60" cy="60" r="42" fill="#FFD84D" stroke="#092F24" stroke-width="5"/><circle cx="43" cy="42" r="5" fill="#092F24"/><circle cx="68" cy="35" r="5" fill="#092F24"/><circle cx="78" cy="57" r="5" fill="#092F24"/><circle cx="49" cy="67" r="5" fill="#092F24"/><circle cx="68" cy="81" r="5" fill="#092F24"/></svg></div><div class="loader-word">Rally<span>Up</span></div><div class="loader-bar"><div id="loader-fill" class="loader-fill"></div></div><small id="loader-percent">12%</small></div></div>
  <div id="app"></div><div id="toast-root"></div><div id="modal-root"></div><div id="live-region" class="sr-only" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body></html>
